<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Projet de loi Égalité · Simulation parlementaire Merídio Rouen</title>
<meta name="description" content="Projet de loi n° 781 « Égalité » de la simulation parlementaire Merídio Rouen, consultable par partie et par article.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap">
<style id="css">
:root{
  --paper:#f4f5f6; --surface:#ffffff; --stone:#c6c7c9; --stone-soft:#e3e4e6; --ink:#0f2650; --muted:#596277; --line:#d6d9df;
  --blue:#00439a; --blue-soft:#e3ecf8; --red:#e2001a; --white:#ffffff;
  --accent:#00439a; --accent-soft:#e3ecf8; --accent-ink:#ffffff; --mark:#fde9a8; --mark-ink:#0f2650;
  --p1:#00439a; --p2:#6a3d9a; --p3:#c4122f; --p4:#4a5468;
  --lg-r:#be352e; --lg-b:#20448f; --lg-n:#12166b;
  --shadow:0 1px 2px rgba(15,38,80,.06),0 8px 24px rgba(15,38,80,.07);
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-text:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ui:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-label:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0a1428; --surface:#111e38; --stone:#3a4357; --stone-soft:#1a2742; --ink:#e8ecf5; --muted:#9ba6bf; --line:#263452;
  --blue:#7aa5ec; --blue-soft:#18305a; --red:#ff5468; --white:#e8ecf5;
  --accent:#7aa5ec; --accent-soft:#18305a; --accent-ink:#071224; --mark:#5b4a12; --mark-ink:#fff6d8;
  --p1:#2f63b8; --p2:#7c52b0; --p3:#c8324a; --p4:#5b667d; --lg-r:#e0564d; --lg-b:#5f8ad8; --lg-n:#b4b9f2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0a1428; --surface:#111e38; --stone:#3a4357; --stone-soft:#1a2742; --ink:#e8ecf5; --muted:#9ba6bf; --line:#263452;
  --blue:#7aa5ec; --blue-soft:#18305a; --red:#ff5468; --white:#e8ecf5;
  --accent:#7aa5ec; --accent-soft:#18305a; --accent-ink:#071224; --mark:#5b4a12; --mark-ink:#fff6d8;
  --p1:#2f63b8; --p2:#7c52b0; --p3:#c8324a; --p4:#5b667d; --lg-r:#e0564d; --lg-b:#5f8ad8; --lg-n:#b4b9f2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(var(--hh,180px) + 12px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1120px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* En-tête */
header.top{position:sticky;top:0;z-index:20;background:var(--stone-soft);box-shadow:0 1px 0 var(--line);padding-top:env(safe-area-inset-top,0px)}
header.top::after{content:"";display:block;height:5px;background:linear-gradient(90deg,var(--blue) 0 33.33%,var(--white) 33.33% 66.66%,var(--red) 66.66% 100%)}
header.top .wrap{max-width:1240px;padding-block:14px 10px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:10px 28px;align-items:center}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.brand svg.logo{flex:none;width:58px;height:auto;display:block}
.eyebrow{font-family:var(--f-label);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:clamp(19px,2.2vw,26px);line-height:1.15;letter-spacing:.03em;text-transform:uppercase;color:var(--blue)}
.brand h1 small{font-size:.5em;letter-spacing:.08em;color:var(--muted);margin-left:8px;white-space:nowrap}
.searchbar{display:flex;gap:8px;min-width:0}
.field{position:relative;flex:1;min-width:140px}
.field svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
#q{width:100%;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 36px 0 38px;font-size:15px}
#q:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
#qclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:30px;height:30px;border-radius:6px;color:var(--muted)}
.btn{height:42px;border-radius:6px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.small{height:36px;font-size:13.5px;padding:0 12px;border-radius:5px}

/* Boutons des parties et des articles */
.navs{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding:3px 3px 4px;align-items:center}
.row .lab{display:none;flex:none;font-family:var(--f-label);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);width:64px}
.row button{flex:none;border:1px solid var(--stone);background:var(--surface);border-radius:4px;height:36px;padding:0 12px;font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.row button b{font-family:var(--f-label);font-weight:600;letter-spacing:.04em;color:var(--ink)}
.row button.pc{background:var(--pc);border-color:var(--pc);color:rgba(255,255,255,.86)}
.row button.pc b{color:#fff}
.row button.pc:hover{filter:brightness(1.12)}
.row button.in{box-shadow:0 0 0 2px var(--stone-soft),0 0 0 4px var(--stone)}
.row button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--stone-soft),0 0 0 4px var(--ink)}
.row button.plain[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--accent-ink);box-shadow:inset 0 -3px 0 var(--red)}
.row button.plain[aria-pressed="true"] b{color:var(--accent-ink)}
.row .sep{flex:none;width:1px;height:22px;background:var(--stone);margin:0 4px}
.row.arts button{min-width:44px;justify-content:center;padding:0 10px;font-family:var(--f-label);font-weight:600;font-size:14px;color:#fff}
.row.arts button sup{font-size:.62em;margin-left:1px;letter-spacing:0}
@media (min-width:601px){.row{flex-wrap:wrap;overflow:visible}}
@media (max-width:1180px){.row button.pc span{display:none}}

/* Corps */
main.wrap{max-width:860px;padding-block:28px 64px;display:flex;flex-direction:column;gap:26px}
.cover{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:4px;padding:26px 28px;text-align:center;box-shadow:var(--shadow)}
.cover .no{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:.06em;color:var(--muted)}
.cover .an{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4vw,32px);letter-spacing:.06em;text-transform:uppercase;margin:6px 0 2px}
.cover .leg{font-family:var(--f-label);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cover .ti{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,46px);letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:18px 0 4px;line-height:1.1}
.cover .ti span{display:block;font-size:.55em;letter-spacing:.14em;color:var(--ink)}
.cover .lec{font-family:var(--f-text);font-style:italic;color:var(--muted);margin:0 0 18px}
.cover dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0 auto;max-width:560px;text-align:left;padding:14px 16px;background:var(--paper);border-radius:6px;font-size:14px}
.cover dt{font-family:var(--f-label);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.cover dd{margin:0}
.toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px;text-align:left}
.toc button{border:1px solid var(--line);border-left:4px solid var(--pc);background:var(--surface);border-radius:4px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.toc button:hover{border-color:var(--pc)}
.toc .k{font-family:var(--f-label);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--pc);font-weight:600}
.toc .t{font-family:var(--f-text);font-weight:700;font-size:15.5px;line-height:1.3}
.toc .c{font-size:12.5px;color:var(--muted)}

.sec{display:flex;flex-direction:column;gap:18px}
.part-h{display:flex;align-items:center;gap:14px;padding:24px 20px 14px;background:var(--stone-soft);clip-path:polygon(0 12px,50% 0,100% 12px,100% 100%,0 100%);border-bottom:3px solid var(--pc)}
.part-h .k{display:inline-block;font-family:var(--f-label);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--pc);border-radius:3px;padding:1px 8px;font-weight:600;margin-bottom:4px}
.part-h h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(20px,3vw,25px);line-height:1.2;letter-spacing:.03em;color:var(--blue);text-wrap:balance}
.part-h .sum{margin-left:auto;text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap}
.part-h .sum b{display:block;font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--ink);line-height:1}
.part-h button.go{border:0;background:none;padding:0;text-align:left;color:inherit}
.part-h button.go:hover h2{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}

article.art{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 24px 22px;box-shadow:var(--shadow)}
.art-h{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
.badge{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:56px;height:30px;padding:0 9px;border-radius:4px 4px 2px 2px;background:var(--pc);color:#fff;font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.03em;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.badge sup{font-size:.65em}
.art-h .tt{min-width:0}
.art-h h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.04em;color:var(--blue);line-height:1.15}
.art-h h3 sup{font-size:.6em}
.art-h .obj{margin:3px 0 0;font-family:var(--f-text);font-style:italic;color:var(--muted);font-size:16px;line-height:1.4}
.art-h a.lnk,.art-h button.lnk{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:5px;height:32px;padding:0 10px;font-size:13px;color:var(--muted)}
.art-h button.lnk:hover{border-color:var(--accent);color:var(--accent)}
.al{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 8px;margin:0 0 12px;font-family:var(--f-text);font-size:16px;line-height:1.7;overflow-wrap:anywhere}
.al:last-child{margin-bottom:0}
.al .n{font-family:var(--f-label);font-weight:600;font-size:14px;color:var(--pc);padding-top:3px;text-align:right}
.al p{margin:0}
.al.free{grid-template-columns:minmax(0,1fr);padding-left:42px}
.al ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.al ol li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px;padding-left:4px}
.al ol li i{font-style:normal;color:var(--muted);font-family:var(--f-label);font-size:14px;padding-top:3px}
.prose{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:4px;padding:22px 26px;font-family:var(--f-text);font-size:16px;line-height:1.7;box-shadow:var(--shadow)}
.prose p{margin:0 0 .9em}.prose p:last-child{margin:0}
.prose h2{margin:0 0 14px;font-family:var(--f-display);font-weight:700;font-size:25px;letter-spacing:.04em;color:var(--blue)}
.sign{text-align:center;font-family:var(--f-text);color:var(--muted);padding:6px 0}
.sign b{display:block;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.05em;color:var(--ink);margin-top:4px}
.crumb{font-family:var(--f-label);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:3px 8px;font:inherit;font-weight:600;letter-spacing:.06em}
.pager{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.pager button{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.pager button.nx{text-align:right}
.pager button:hover:not(:disabled){border-color:var(--accent)}
.pager .d{font-family:var(--f-label);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pager .t{font-family:var(--f-text);font-weight:700;font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.results-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:3px solid var(--blue)}
.results-h h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.03em;color:var(--blue)}
.results-h p{margin:0;color:var(--muted);font-size:13.5px;display:flex;gap:8px;align-items:center}
.empty{color:var(--muted);font-size:15px}
mark{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13.5px;z-index:50;max-width:calc(100vw - 32px)}

@media (max-width:860px){
  header.top .wrap{grid-template-columns:minmax(0,1fr)}
  .toc{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  header.top{position:static}
  html{scroll-padding-top:12px}
  .brand svg.logo{width:42px}
  .brand h1 small{display:block;margin:4px 0 0}
  .searchbar .btn span{display:none}
  .row .lab{display:none}
  .row button.pc span{display:none}
  .badge{display:none}
  main.wrap{padding-block:20px 48px;gap:20px}
  article.art{padding:16px 16px 18px}
  .prose{padding:18px 18px}
  .cover{padding:22px 16px}
  .cover dl{grid-template-columns:minmax(0,1fr);gap:2px}
  .cover dd{margin-bottom:8px}
  .art-h{flex-wrap:wrap}
  .art-h button.lnk{display:none}
  .al{grid-template-columns:26px minmax(0,1fr);font-size:15.5px}
  .al.free{padding-left:34px}
  .part-h .sum{display:none}
  .pager button.pv .t,.pager button.nx .t{white-space:normal}
}
</style>
</head>
<body>
<template id="tpl"><header class="top" id="top">
  <div class="wrap">
    <div class="brand">
      <svg class="logo" viewBox="0 0 811 778" fill="none" stroke-width="20" role="img" aria-label="Logo Simulation parlementaire"><circle cx="400.5" cy="365.7" r="354" style="stroke:var(--lg-r)"/><circle cx="400.0" cy="366.5" r="252.5" style="stroke:var(--lg-r)"/><circle cx="445.0" cy="411.7" r="354" style="stroke:var(--lg-b)"/><circle cx="445.4" cy="411.9" r="253.1" style="stroke:var(--lg-b)"/><circle cx="351.5" cy="427.1" r="339" style="stroke:var(--lg-n)"/><circle cx="351.3" cy="427.5" r="242.3" style="stroke:var(--lg-n)"/></svg>
      <div style="min-width:0">
        <div class="eyebrow">Merídio Rouen · simulation parlementaire</div>
        <h1>Projet de loi Égalité <small>N° 781 · Première lecture</small></h1>
      </div>
    </div>
    <div class="searchbar" role="search">
      <div class="field">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label for="q" class="sr">Rechercher dans le texte</label>
        <input id="q" type="search" autocomplete="off" placeholder="Rechercher dans le texte">
        <button id="qclear" type="button" aria-label="Effacer la recherche" hidden>✕</button>
      </div>
    </div>
    <div class="navs">
      <nav class="row" id="parts" aria-label="Parties du texte"></nav>
      <nav class="row arts" id="arts" aria-label="Articles"></nav>
    </div>
  </div>
</header>
<main class="wrap" id="main" aria-live="polite"></main></template>
<script id="app">(function(){
"use strict";
const tpl = document.getElementById('tpl');
document.body.insertBefore(tpl.content.cloneNode(true), tpl);

/* ---------- Le texte ----------
   Chaque alinéa : "1° …" (numéroté), un texte simple (paragraphe sans numéro),
   ou {n:"2°", t:"…", list:["(a) …"]} (alinéa suivi d'une énumération). */
const DOC = {
  numero: '781', titre: 'Égalité', lecture: 'Première lecture', depot: '24 octobre 2026',
  transmis: ['Madame la Première ministre', 'Monsieur le ministre de l’Éducation nationale', 'Monsieur le ministre chargé de la Décentralisation et de l’Aménagement du territoire'],
  destinataire: 'Monsieur le Président de l’Assemblée nationale',
  signature: {date: '24/10/2026', par: 'Présidence Merídio – Rouen'},
  motifs: [
    'L’égalité est l’un des fondements de notre République. Pourtant, les inégalités persistent : écarts de rémunération entre les femmes et les hommes, violences sexistes, harcèlement scolaire et discriminations en tout genre, obstacles liés au handicap, difficultés d’accès aux soins médicaux, fracture numérique dans les territoires, inégalités face au logement…',
    'Ces constats révèlent les limites de notre système actuel. Nous ne pouvons plus nous contenter de proclamer des droits sans garantir leur application effective. L’égalité ne doit pas être une promesse, mais une réalité pour toutes et tous, sur l’ensemble du territoire national.',
    'En matière d’égalité entre les femmes et les hommes, le texte propose de renforcer la parité dans les entreprises, l’enseignement supérieur et les assemblées parlementaires, de lutter contre les écarts de rémunération injustifiés et de mieux prévenir le sexisme. Il vise également à renforcer la protection des victimes de violence. Il s’agit de passer des déclarations de principe à des obligations effectives, assorties de mécanismes de contrôle et de correction.',
    'En matière d’égalité des chances, le projet prévoit de veiller à l’accessibilité de tous les bâtiments publics de l’État. Il entend également mieux protéger les élèves contre le harcèlement et le cyberharcèlement, en associant protection des victimes, responsabilisation des auteurs et accompagnement éducatif. Il aborde par ailleurs la question de la liberté de conscience et celle de l’accès aux droits, qui exigent un cadre clair et respectueux des principes fondamentaux de la République.',
    'Enfin, l’égalité républicaine ne saurait dépendre du lieu de résidence. Le texte entend répondre aux difficultés d’accès aux soins par une meilleure répartition des médecins, moderniser les démarches administratives en prévenant l’exclusion numérique et réformer la gestion du logement social en France.',
    'Ce projet porte une conviction simple : une République juste ne se contente pas de proclamer des droits. Elle se donne les moyens de les faire respecter. Sa mise en œuvre devra reposer sur des règles claires, des moyens adaptés et une évaluation effective des résultats.',
    'Le Parlement a le choix entre la résignation face aux inégalités et la volonté de les combattre. Le Gouvernement, lui, a fait son choix. Adopter ce texte, c’est affirmer que la justice sociale, la protection des personnes et la cohésion des territoires exigent des actes.',
    'C’est faire le choix d’une République plus juste, plus accessible et plus responsable.'
  ],
  parties: [
    {n: 1, r: 'I', titre: 'De l’égalité entre les femmes et les hommes', court: 'Femmes et hommes', color: 'var(--p1)', articles: [
      {n: 1, titre: 'Garantir la parité dans la société', al: [
        '1° La parité entre les femmes et les hommes constitue un objectif fondamental de la République.',

      {n: 3, titre: 'Renforcer la lutte contre le sexisme et protéger les victimes', al: [

/* ---------- Outils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[’']/g,"'");
const ARTS = [];
DOC.parties.forEach(p => p.articles.forEach(a => { a.part = p; ARTS.push(a); }));
const artLabel = (a, html) => a.n === 1 ? (html ? '1<sup>er</sup>' : '1er') : String(a.n);
const plural = (n, w) => n + ' ' + w + (n > 1 ? 's' : '');

/* Alinéas normalisés : {n, t, list} */
function parseAl(x){
  if (typeof x === 'object') return {n: x.n, t: x.t, list: x.list || []};
  const m = x.match(/^(\d+°)\s+([\s\S]*)$/);
  return m ? {n: m[1], t: m[2], list: []} : {n: '', t: x, list: []};
}
ARTS.forEach(a => {
  a.als = a.al.map(parseAl);
  a.plain = a.als.map(x => (x.n ? x.n + ' ' : '') + x.t + (x.list.length ? '\n' + x.list.map(l => '   ' + l).join('\n') : '')).join('\n\n');
  a.f = fold('article ' + a.n + ' ' + a.titre + '\n' + a.plain);
});
const MOTIFS_F = fold(DOC.motifs.join('\n'));

/* ---------- État / navigation ---------- */
let view = 'all', rx = null;
function parseHash(h){
  h = (h || '').replace(/^#/, '');
  let m;
  if ((m = h.match(/^article-(\d+)$/)) && ARTS.find(a => a.n === +m[1])) return 'a' + m[1];
  if ((m = h.match(/^partie-(\d)$/)) && DOC.parties.find(p => p.n === +m[1])) return 'p' + m[1];
  if (h === 'expose-des-motifs') return 'motifs';
  return 'all';
}
const hashOf = v => v === 'motifs' ? '#expose-des-motifs' : v[0] === 'a' ? '#article-' + v.slice(1) : v[0] === 'p' ? '#partie-' + v.slice(1) : '';
function go(v, opts){
  view = v; clearSearch();
  try { history.replaceState(null, '', hashOf(v) || (location.pathname + location.search)); } catch (e) {}
  render();
  if (!opts || !opts.keepScroll) window.scrollTo({top: 0});
  const pressed = document.querySelector('#arts [aria-pressed="true"]');
  if (pressed) pressed.scrollIntoView({block: 'nearest', inline: 'nearest'});
}
window.addEventListener('hashchange', () => { const v = parseHash(location.hash); if (v !== view) go(v); });

/* ---------- Boutons ---------- */
function renderNav(){
  const cp = view[0] === 'p' ? +view.slice(1) : null;
  const ca = view[0] === 'a' ? ARTS.find(a => a.n === +view.slice(1)) : null;
  $('#parts').innerHTML = `<span class="lab">Parties</span>` +
    `<button type="button" class="plain" data-v="all" aria-pressed="${view === 'all'}"><b>Texte intégral</b></button>` +
    `<button type="button" class="plain" data-v="motifs" aria-pressed="${view === 'motifs'}"><b>Exposé des motifs</b></button><span class="sep"></span>` +
    DOC.parties.map(p => `<button type="button" class="pc${ca && ca.part === p ? ' in' : ''}" style="--pc:${p.color}" data-v="p${p.n}" aria-pressed="${cp === p.n}" title="Partie ${p.r} : ${esc(p.titre)}"><b>Partie ${p.r}</b><span>${esc(p.court)}</span></button>`).join('');
  $('#arts').innerHTML = `<span class="lab">Articles</span>` + DOC.parties.map((p, i) =>
    (i ? '<span class="sep"></span>' : '') + p.articles.map(a => `<button type="button" class="pc${cp === p.n ? ' in' : ''}" style="--pc:${p.color}" data-v="a${a.n}" aria-pressed="${ca === a}" title="Article ${artLabel(a)} : ${esc(a.titre)}" aria-label="Article ${artLabel(a)}">${artLabel(a, true)}</button>`).join('')).join('');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-v]'); if (b) { go(b.dataset.v); return; }
  const c = e.target.closest('[data-copy]'); if (c) { const a = ARTS.find(x => x.n === +c.dataset.copy); if (a) copyText(artText(a)); return; }
  if (e.target.closest('[data-clear]')) { clearSearch(); render(); }
});

/* ---------- Rendu ---------- */
const hl = s => { s = esc(s); return rx ? s.replace(rx, '<mark>$1</mark>') : s; };
function artHTML(a, withLink){
  const p = a.part;
  let h = `<article class="art" id="article-${a.n}" style="--pc:${p.color}"><div class="art-h"><span class="badge">Art. ${artLabel(a, true)}</span><div class="tt"><h3>Article ${artLabel(a, true)}</h3><p class="obj">${hl(a.titre)}</p></div>` +
    (withLink ? `<button type="button" class="lnk" data-v="a${a.n}">Ouvrir seul</button>` : '') + `</div>`;
  for (const x of a.als) {
    h += x.n ? `<div class="al"><span class="n">${x.n}</span><div><p>${hl(x.t)}</p>` : `<div class="al free"><div><p>${hl(x.t)}</p>`;
    if (x.list.length) h += '<ol>' + x.list.map(l => { const m = l.match(/^(\([a-z]\))\s*(.*)$/); return m ? `<li><i>${m[1]}</i><span>${hl(m[2])}</span></li>` : `<li><i></i><span>${hl(l)}</span></li>`; }).join('') + '</ol>';
    h += '</div></div>';
  }
  return h + '</article>';
}
function partHead(p, clickable){
  const n = p.articles.length;
  const first = p.articles[0], last = p.articles[n - 1];
  const inner = `<span class="k">Partie ${p.r}</span><h2>${esc(p.titre)}</h2>`;
  return `<div class="part-h" style="--pc:${p.color}">${clickable ? `<button type="button" class="go" data-v="p${p.n}">${inner}</button>` : `<div>${inner}</div>`}<div class="sum"><b>${n}</b>${n > 1 ? 'articles' : 'article'} · ${n > 1 ? 'art. ' + artLabel(first, true) + ' à ' + artLabel(last, true) : 'art. ' + artLabel(first, true)}</div></div>`;
}
function motifsHTML(){ return `<section class="prose" id="expose-des-motifs"><h2>Exposé des motifs</h2>${DOC.motifs.map(t => `<p>${hl(t)}</p>`).join('')}</section>`; }
function coverHTML(){
  return `<section class="cover"><div class="no">N° ${DOC.numero}</div><div class="an">Assemblée nationale</div><div class="leg">Constitution du 4 octobre 1958 · Dix-septième législature</div>
    <div class="ti"><span>Projet de loi</span>${esc(DOC.titre)}</div><p class="lec">${esc(DOC.lecture)}</p>
    <dl><dt>Enregistré le</dt><dd>${esc(DOC.depot)}, à la présidence de l’Assemblée nationale</dd><dt>Transmis par</dt><dd>${DOC.transmis.map(esc).join('<br>')}</dd><dt>À</dt><dd>${esc(DOC.destinataire)}</dd></dl></section>`;
}
function tocHTML(){
  return `<div class="toc" style="margin-top:0">${DOC.parties.map(p => `<button type="button" style="--pc:${p.color}" data-v="p${p.n}"><span class="k">Partie ${p.r}</span><span class="t">${esc(p.titre)}</span><span class="c">${p.articles.length > 1 ? 'Articles ' + artLabel(p.articles[0], true) + ' à ' + p.articles[p.articles.length - 1].n : 'Article ' + p.articles[0].n}</span></button>`).join('')}</div>`;
}
const signHTML = () => `<p class="sign">Fait le ${esc(DOC.signature.date)}<b>${esc(DOC.signature.par)}</b></p>`;
function pager(prev, next){
  const btn = (x, cls, dir) => x ? `<button type="button" class="${cls}" data-v="${x.v}"><span class="d">${dir}</span><span class="t">${x.t}</span></button>` : `<button type="button" class="${cls}" disabled><span class="d">${dir}</span><span class="t">—</span></button>`;
  return `<div class="pager">${btn(prev, 'pv', '← Précédent')}${btn(next, 'nx', 'Suivant →')}</div>`;
}
function render(){
  renderNav();
  if ($('#q').value.trim()) { runSearch(); return; }
  rx = null;
  let h = '';
  if (view === 'all') {
    h += coverHTML() + motifsHTML() + tocHTML();
    for (const p of DOC.parties) h += `<section class="sec" id="partie-${p.n}">${partHead(p, true)}${p.articles.map(a => artHTML(a, true)).join('')}</section>`;
    h += signHTML();
  } else if (view === 'motifs') {
    h += motifsHTML() + pager(null, {v: 'p1', t: 'Partie I · ' + esc(DOC.parties[0].court)});
  } else if (view[0] === 'p') {
    const i = DOC.parties.findIndex(p => p.n === +view.slice(1)), p = DOC.parties[i];
    const pv = DOC.parties[i - 1], nx = DOC.parties[i + 1];
    h += `<section class="sec">${partHead(p, false)}${p.articles.map(a => artHTML(a, true)).join('')}</section>`;
    h += pager(pv ? {v: 'p' + pv.n, t: 'Partie ' + pv.r + ' · ' + esc(pv.court)} : {v: 'motifs', t: 'Exposé des motifs'}, nx ? {v: 'p' + nx.n, t: 'Partie ' + nx.r + ' · ' + esc(nx.court)} : null);
  } else {
    const i = ARTS.findIndex(a => a.n === +view.slice(1)), a = ARTS[i], p = a.part;
    const pv = ARTS[i - 1], nx = ARTS[i + 1];
    h += `<div class="crumb"><button type="button" data-v="p${p.n}">Partie ${p.r}</button><span>${esc(p.titre)}</span></div>`;
    h += artHTML(a, false);
    h += `<div class="tools"><button type="button" class="btn small" data-copy="${a.n}">Copier l’article</button><button type="button" class="btn small" data-v="p${p.n}">Toute la partie ${p.r}</button></div>`;
    h += pager(pv ? {v: 'a' + pv.n, t: 'Art. ' + artLabel(pv, true) + ' · ' + esc(pv.titre)} : null, nx ? {v: 'a' + nx.n, t: 'Art. ' + artLabel(nx, true) + ' · ' + esc(nx.titre)} : null);
  }
  $('#main').innerHTML = h;
}

/* ---------- Recherche ---------- */
let qTimer;
function clearSearch(){ $('#q').value = ''; $('#qclear').hidden = true; rx = null; }
function runSearch(){
  const q = $('#q').value.trim(); $('#qclear').hidden = !q;
  if (!q) { render(); return; }
  const fq = fold(q).replace(/\s+/g, ' ');
  const m = fq.match(/^(?:art(?:icle)?\.?\s*)?(\d{1,2})(?:er)?$/);
  if (m && ARTS.find(a => a.n === +m[1])) { const a = ARTS.find(x => x.n === +m[1]); $('#main').innerHTML = `<div class="results-h"><h2>Article ${artLabel(a, true)}</h2><p><button class="btn small" type="button" data-v="a${a.n}">Ouvrir l’article</button></p></div>` + artHTML(a, true); return; }
  const ts = fq.split(/[\s']+/).filter(w => w.length > 1);
  rx = ts.length ? new RegExp('(' + ts.map(w => w.split('').map(ch => ({a:'[aàâä]',e:'[eéèêë]',i:'[iîï]',o:'[oôöœ]',u:'[uùûü]',c:'[cç]'})[ch] || ch.replace(/[.*+?^${}()|[\]\\-]/g, '\\$&')).join('')).join('|') + ')', 'giu') : null;
  const list = ARTS.filter(a => ts.every(w => a.f.includes(w)));
  const inMotifs = ts.length && ts.every(w => MOTIFS_F.includes(w));
  let h = `<div class="results-h"><h2>Recherche : « ${esc(q)} »</h2><p>${plural(list.length, 'article')}${inMotifs ? ' · exposé des motifs' : ''} <button class="btn small" type="button" data-clear>Effacer</button></p></div>`;
  if (!list.length && !inMotifs) h += `<p class="empty">Rien ne correspond. Essayez un autre mot, ou un numéro d’article (« 7 »).</p>`;
  h += list.map(a => artHTML(a, true)).join('');
  if (inMotifs) h += motifsHTML();
  $('#main').innerHTML = h;
  renderNav();
}
$('#q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(runSearch, 150); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape') { clearSearch(); render(); } if (e.key === 'Enter') { e.preventDefault(); clearTimeout(qTimer); runSearch(); } });
$('#qclear').onclick = () => { clearSearch(); render(); $('#q').focus(); };

/* Flèches gauche/droite : article précédent / suivant */
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName) || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const b = document.querySelector(e.key === 'ArrowLeft' ? '.pager .pv:not(:disabled)' : '.pager .nx:not(:disabled)');
  if (b) { e.preventDefault(); b.click(); }
});

/* ---------- Copier ---------- */
function artText(a){ return `Projet de loi n° ${DOC.numero} — ${DOC.titre}\nPartie ${a.part.r} : ${a.part.titre}\n\nArticle ${artLabel(a)} : ${a.titre}\n\n${a.plain}`; }
function toast(msg){ document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2800); }
function copyRaw(s, okMsg){
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.append(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); toast(ok ? okMsg : 'Copie impossible ici'); };
  try { navigator.clipboard.writeText(s).then(() => toast(okMsg), fallback); } catch (e) { fallback(); }
}
const copyText = s => copyRaw(s, 'Article copié');


const hh = () => document.documentElement.style.setProperty('--hh', $('#top').offsetHeight + 'px');
try { new ResizeObserver(hh).observe($('#top')); } catch (e) { window.addEventListener('resize', hh); } hh();

/* ---------- Démarrage ---------- */
view = parseHash(location.hash);
render();
})();
</script>
